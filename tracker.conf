# ══════════════════════════════════════════════════════════════════════════════
# Edge AI Multi-Sport Tracker — runtime configuration
# Loaded by pi-4-run.sh on startup. Command-line flags override these values.
# ══════════════════════════════════════════════════════════════════════════════

# ── Vision detector ────────────────────────────────────────────────────────────
# Options: color_based | yolo | hailo
#   color_based  — HSV colour-range detector, no model file required, fastest
#   yolo         — YOLOv8n via ONNX Runtime on CPU (~4 fps on Pi 5)
#   hailo        — YOLOv8n on Hailo-8L NPU (requires --hailo build & .hef model)
VISION="hailo"

# ── State estimator ────────────────────────────────────────────────────────────
# Options: kalman_cv | kalman_ca | imm
#   kalman_cv  — constant-velocity Kalman filter (smooth, small lag)
#   kalman_ca  — constant-acceleration Kalman filter (handles speed changes)
#   imm        — Interacting Multiple Model (best all-round, slightly heavier)
ESTIMATOR="imm"

# ── Motor controller ───────────────────────────────────────────────────────────
# Options: simplefoc | mock
#   simplefoc  — real gimbal via SimpleFOC over serial
#   mock       — prints commands to stdout, no hardware required
MOTOR="simplefoc"

# ── Serial port for SimpleFOC ─────────────────────────────────────────────────
# Ignored when MOTOR=mock. Common values: /dev/ttyACM0  /dev/ttyUSB0
SERIAL_PORT="/dev/ttyACM0"

# ── Camera capture resolution ─────────────────────────────────────────────────
CAP_WIDTH=1280
CAP_HEIGHT=720

# ── Camera capture frame rate ─────────────────────────────────────────────────
# The GStreamer pipeline requests this rate from libcamera.
CAP_FPS=30

# ── Local display window ──────────────────────────────────────────────────────
# true  — open an OpenCV window (requires a connected monitor / X11 session)
# false — headless mode, no window opened
DISPLAY_ENABLED=false

# ── Web dashboard streaming ───────────────────────────────────────────────────
# true  — serve MJPEG stream + control dashboard on WEB_PORT
# false — disable web server entirely
WEB_STREAM=true

# ── Web dashboard port ─────────────────────────────────────────────────────────
# Access the dashboard at http://<pi-ip>:WEB_PORT after launching
WEB_PORT=8080

# ── Camera field of view ──────────────────────────────────────────────────────
# Horizontal and vertical FOV in degrees for the lens in use.
# Used to convert pixel tracking error into gimbal angles.
# Arducam IMX219 with standard M12 lens @ 1280×720: ~62° H, ~35° V.
# Measure your actual lens or use: vfov = 2*atan(tan(hfov/2) * (height/width)) * (180/pi)
HFOV_DEG=62.0
VFOV_DEG=35.0

# ── Color-assist hybrid mode ──────────────────────────────────────────────────
# When true, a fast HSV color detector runs inline on every camera frame.
# It fills in detections on frames where hailo/yolo has no fresh result yet,
# eliminating Kalman-only coasting and reducing choppiness.
# Has no effect when VISION=color_based (already using color).
COLOR_ASSIST=true

# ── Raw-detection gimbal mode (debug) ─────────────────────────────────────────
# When true, the gimbal aims at the raw YOLO/Hailo bounding-box centre instead
# of the Kalman-filtered position.  Removes all smoothing and lag introduced by
# the state estimator — useful for isolating whether the Kalman filter is the
# source of aiming error during calibration.
# false — normal operation: Kalman-filtered position (recommended)
# true  — bypass Kalman: aim directly at raw detection centre
RAW_DETECTION=true